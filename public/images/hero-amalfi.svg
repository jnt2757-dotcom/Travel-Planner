<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Positano cliffside at dusk</title>
  <desc id="d">Layered terracotta cliffs above a teal sea beneath a warm dusk sky</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9CFAE"/>
      <stop offset="45%" stop-color="#DDB79A"/>
      <stop offset="100%" stop-color="#C98F72"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E6E6B"/>
      <stop offset="100%" stop-color="#274C4D"/>
    </linearGradient>
    <linearGradient id="cliffFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C6F4E"/>
      <stop offset="100%" stop-color="#6E5640"/>
    </linearGradient>
    <linearGradient id="cliffNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B4632"/>
      <stop offset="100%" stop-color="#3A2E22"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBEFDC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FBEFDC" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="260" r="220" fill="url(#sun)"/>
  <circle cx="1180" cy="260" r="70" fill="#FBEFDC" opacity="0.9"/>
  <path d="M0,430 Q250,330 480,420 Q700,500 900,410 Q1150,300 1600,420 L1600,560 L0,560 Z" fill="url(#cliffFar)" opacity="0.75" filter="url(#soft)"/>
  <path d="M0,560 Q220,470 400,540 Q650,630 900,540 Q1200,430 1600,560 L1600,700 L0,700 Z" fill="url(#cliffNear)"/>
  <g opacity="0.55">
    <rect x="260" y="470" width="26" height="34" rx="6" fill="#E7C9A9"/>
    <rect x="300" y="460" width="20" height="44" rx="6" fill="#D8B48E"/>
    <rect x="330" y="478" width="30" height="26" rx="6" fill="#E7C9A9"/>
    <rect x="700" y="490" width="24" height="30" rx="6" fill="#D8B48E"/>
    <rect x="732" y="475" width="18" height="45" rx="6" fill="#E7C9A9"/>
  </g>
  <rect y="700" width="1600" height="200" fill="url(#sea)"/>
  <g stroke="#FBEFDC" stroke-opacity="0.25" stroke-width="3" fill="none">
    <path d="M0,740 Q400,720 800,745 T1600,735"/>
    <path d="M0,790 Q400,770 800,795 T1600,785"/>
    <path d="M0,840 Q400,825 800,845 T1600,835"/>
  </g>
</svg>
